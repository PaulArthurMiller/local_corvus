    prompt_text: "format, structure, delimiter — according to the rules for how files are written, what applies here?"
    gold_mu_ids:
      - "a0000002-aaaa-4aaa-8aaa-000000000002"   # a_spoke1 / rule K-1 (words present in own content excluded: ['field', 'output'])
    is_bridge_probe: false
    bridge_pair_id: null

