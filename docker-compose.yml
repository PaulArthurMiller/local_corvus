services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./memory:/app/data
      - ./config.yaml:/app/config.yaml
      - ./probes:/app/probes
      - ./seed_fixtures:/app/seed_fixtures
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - MEMORY_PATH=/app/data
      - CONFIG_PATH=/app/config.yaml
      - PROBES_PATH=/app/probes
      - SEED_FIXTURES_PATH=/app/seed_fixtures
      - CONDITION_LABEL=${CONDITION_LABEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  admin:
    build: ./admin
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
