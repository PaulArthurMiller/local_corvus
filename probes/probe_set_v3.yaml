version: "v3"

# seed_v3 probe battery (Milestone 28). Golds are spoke MUs, one probe per
# spoke per cluster (28 total: 7 spokes x 4 clusters) — see seed_v3_mu_spec.md
# section 6 and BUILD-PLAN.md Milestone 28.
#
# Prompt text FRONT-LOADS that cluster's entry vocabulary (ENTRY_VOCAB in
# generate_seed_v3.py) — the 3 picked words open every prompt, not just
# appear somewhere in it, because retrieve() only takes the first
# hyperparameters.retrieval_keyword_count (5) non-stopword tokens of the
# query as BM25 keywords (backend/memory/retrieval.py); vocabulary placed
# later in the sentence is silently invisible to retrieval.
#
# The 3 picked words are chosen from that cluster's entry vocabulary MINUS
# every word that actually appears (whole-word) in the gold spoke's own
# FROZEN content — not just its documented "anchor" word. Content gists were
# free-form prose (spec §4 "to taste") and several spokes ended up using
# more than their one assigned anchor word; picking against real content,
# not the anchor label, is what actually guarantees BM25 can't find the gold
# spoke directly via lexical match — confirmed live during M28 verification,
# where an anchor-only exclusion still let one probe (a_spoke2, via "field")
# surface its own gold directly (rank 2) instead of via K2 traversal only.
#
# No rule ID, answer token, or family name ever appears in a prompt.
#
# Retrieval to a specific spoke is query-independent by design: BM25 always
# lands on the same cluster hub for a given cluster (K1), and K2's top_k=1 is
# winner-take-all across all 7 reciprocal hub<->spoke edges, so it always
# resolves to whichever single spoke currently holds the strongest edge —
# never the probe's wording. Probing every spoke, not just the one that ends
# up trained, is deliberate: the six untrained spokes are negative controls
# whose gold_mu_rank should stay flat (None, never surfaced) across sessions —
# that flatness is itself the discriminative-learning evidence (spec section 6).
#
# Pass criterion: same structural reasoning as v2's cross_cluster_transfer — a
# spoke gold is reachable only via one K2 hop from the hub, so at best it
# occupies rank 4 (K1(3) + K2(1)), never ranks 1-3. See config.yaml
# reporting.pass_rank_thresholds.spoke_retrieval: 4.
#
# Live baseline check (M28, real backend + real seed_v3 fixture, fresh wipe
# + reseed, zero training turns): all 28 probes' gold_mu_rank in {None, 4}
# — every gold either not surfaced at all, or reached exactly at the
# structural K2 position, never via a direct lexical hit. See BUILD-PLAN.md
# Milestone 28 for the recorded distribution.

phenomenon_map:
  spoke_retrieval:
    description: "Gold spoke MU reachable only via hub->spoke K2 traversal; only the currently-trained spoke per cluster should surface, the other six are negative controls"

